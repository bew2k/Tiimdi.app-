<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fc">
<title>Tiimdi · Выгодная еда рядом</title>
<link rel="stylesheet" href="/static/vendor/maplibre/maplibre-gl.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css'">
<style>
  :root {
    --ink:#1b1b3a; --mut:#6f7290; --line:#e8e9f4; --bg:#f5f6fc; --card:#ffffff; --surface:#ffffff; --soft:#f4f5f9; --soft2:#eceef8;
    --violet:#6a3dff; --violet2:#9b7bff; --lav:#e9e6ff;
    --orange:#ff6b00; --orange2:#ff8a00; --red:#ff3333; --pink:#ff5c93; --mint:#22c98a;
    --sh:0 4px 12px rgba(0,0,0,.08); --sh2:0 2px 8px rgba(0,0,0,.06);
    --font:"Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
    --zoom:1; --swoff:#d9dbe9;
  }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  html,body { height:100%; }
  body {
    margin:0; font:14px/1.35 var(--font); color:var(--ink); touch-action:manipulation;
    background:radial-gradient(1200px 600px at 20% -10%, #e4defe 0, transparent 60%), radial-gradient(900px 500px at 100% 110%, #ffe7d6 0, transparent 55%), #f1f2fb;
    display:flex; align-items:center; justify-content:center;
  }
  button { font-family:inherit; }
  .phone { position:relative; zoom:var(--zoom); width:calc(min(100vw,440px) / var(--zoom)); height:calc(100vh / var(--zoom)); height:calc(100dvh / var(--zoom)); background:var(--bg); display:flex; flex-direction:column; overflow:hidden; }
  @media (min-width:520px) { .phone { border-radius:34px; box-shadow:0 30px 80px rgba(60,50,140,.28), 0 0 0 1px rgba(255,255,255,.7); height:calc(min(96vh,880px) / var(--zoom)); } }

  .view { display:none; flex:1; min-height:0; flex-direction:column; }
  .view.on { display:flex; }
  svg.i { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- map ---------- */
  .mapwrap { position:relative; flex:1; min-height:0; background:#e9e6f5; }
  #map { position:absolute; inset:0; z-index:0; }          /* z-index:0 держит пины карты под панелью фильтров */
  .top { position:absolute; z-index:700; left:12px; right:12px; top:calc(12px + env(safe-area-inset-top)); display:grid; grid-template-columns:minmax(0,1fr); gap:10px; pointer-events:none; }
  .top > * { pointer-events:auto; }
  .bar { display:flex; gap:10px; align-items:center; }

  /* логотип-кнопка: объёмная, нажимается */
  .logo { flex:none; height:50px; padding:0 17px; display:flex; align-items:center; font:800 20px/1 var(--font); letter-spacing:-.6px; color:#fff; border:0; border-radius:17px; cursor:pointer; user-select:none; -webkit-user-select:none;
    background:linear-gradient(180deg,#a487ff 0%,#6a3dff 58%,#5a2df0 100%);
    box-shadow:0 5px 0 #4320b8, 0 10px 18px rgba(90,45,240,.42), inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .08s, box-shadow .08s; }
  .logo i { font-style:normal; color:#ffd36b; }
  .logo:active, .logo.hit { transform:translateY(4px); box-shadow:0 1px 0 #4320b8, 0 4px 8px rgba(90,45,240,.35), inset 0 2px 0 rgba(255,255,255,.4); }

  .search { flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:var(--surface); border-radius:16px; padding:0 14px; box-shadow:var(--sh); color:var(--mut); height:50px; }
  .search input { flex:1; min-width:0; border:0; outline:0; padding:13px 0; font:500 14px var(--font); background:transparent; color:var(--ink); caret-color:var(--violet); -webkit-appearance:none; appearance:none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance:none; }
  .search input::placeholder { color:#9a9cb5; }
  .iconbtn { width:50px; height:50px; flex:none; display:grid; place-items:center; background:var(--surface); color:var(--ink); border:0; border-radius:16px; box-shadow:var(--sh); cursor:pointer; padding:0; position:relative; }
  .iconbtn svg.line { fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; width:22px; height:22px; }
  .iconbtn .dot { position:absolute; top:8px; right:8px; width:10px; height:10px; border-radius:50%; background:var(--orange); border:2px solid #fff; display:none; }
  .iconbtn.active .dot { display:block; }
  .iconbtn.on { background:var(--orange); color:#fff; }
  .hint { justify-self:start; background:var(--surface); color:var(--ink); font:600 12px var(--font); padding:6px 12px; border-radius:999px; box-shadow:var(--sh2); }
  .hint b { color:var(--violet); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; font:600 13px var(--font); background:var(--surface); color:var(--ink); border:1px solid transparent; border-radius:999px; padding:10px 14px; box-shadow:var(--sh2); cursor:pointer; white-space:nowrap; }
  .chip.on { border-color:var(--orange); color:var(--orange); font-weight:700; }
  .panel { display:none; background:var(--surface); border-radius:22px; padding:14px; box-shadow:var(--sh); grid-template-columns:1fr 1fr; gap:12px; }
  .panel.on { display:grid; }
  .panel .chips { grid-column:1/-1; flex-wrap:wrap; overflow:visible; padding:0; }
  .panel .chip { background:var(--soft); box-shadow:none; }
  .panel .chip.on { background:#fff3ea; }
  .panel label, dialog label { display:flex; flex-direction:column; gap:5px; font:600 12px var(--font); color:var(--mut); }
  .panel input, .panel select, dialog input, dialog select { font:600 14px var(--font); padding:10px 12px; border:0; border-radius:12px; background:var(--soft); color:var(--ink); width:100%; outline:2px solid transparent; }
  .panel input:focus, .panel select:focus, dialog input:focus, dialog select:focus { outline-color:var(--violet2); }

  .fabs { position:absolute; z-index:500; right:12px; bottom:76px; display:grid; gap:10px; justify-items:end; }
  .fab { width:54px; height:54px; border-radius:50%; border:0; background:var(--surface); box-shadow:var(--sh); font-size:26px; cursor:pointer; display:grid; place-items:center; padding:0; }
  .sheet { position:absolute; z-index:600; left:0; right:0; bottom:0; height:calc(100% - 84px); display:flex; flex-direction:column; background:var(--surface); border-radius:24px 24px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.14); transition:transform .26s cubic-bezier(.2,.8,.2,1); will-change:transform; }
  .sheet[data-s=peek] { transform:translateY(calc(100% - 176px)); }
  .sheet[data-s=half] { transform:translateY(46%); }
  .sheet[data-s=full] { transform:translateY(0); }
  .sheet.drag { transition:none; }
  #shandle { flex:none; touch-action:none; cursor:grab; padding:8px 18px 10px; user-select:none; -webkit-user-select:none; }
  #shandle i { display:block; width:42px; height:5px; border-radius:9px; background:var(--soft2); margin:0 auto 10px; }
  #shandle .row1 { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #shandle b { font:800 18px var(--font); letter-spacing:-.3px; }
  #shandle em { font-style:normal; font-weight:600; font-size:12px; color:var(--mut); }
  .sbody { flex:1; min-height:0; overflow-y:auto; padding:0 14px 20px; -webkit-overflow-scrolling:touch; }
  .sheet[data-s=peek] .sbody { overflow:hidden; }
  .sbody .advice { margin:0 0 10px; }
  .sheet[data-s=peek] .advice { display:none; }
  .srow { display:flex; align-items:center; gap:12px; padding:10px 6px; border-radius:16px; cursor:pointer; border-bottom:1px solid var(--line); }
  .srow:last-child { border-bottom:0; }
  .srow:active { background:var(--soft); }
  .srow .th { position:relative; flex:none; width:60px; height:60px; border-radius:14px; background:var(--c,#eee); display:grid; place-items:center; font-size:30px; overflow:hidden; }
  .srow .th img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .srow .mid { flex:1; min-width:0; display:grid; gap:2px; }
  .srow .mid b { font:700 15px/1.25 var(--font); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .mid span { font-size:12px; color:var(--mut); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .rt { flex:none; text-align:right; display:grid; gap:2px; justify-items:end; }
  .srow .rt b { font:800 16px var(--font); }
  .srow .rt s { font-size:12px; color:#a2a4bb; }
  .srow .rt i { font-style:normal; font:800 11px var(--font); color:#fff; background:var(--red); border-radius:7px; padding:2px 7px; }
  .fabs { bottom:calc(176px + 14px) !important; transition:opacity .2s; }
  .fabs.hide { opacity:0; pointer-events:none; }
  .hotpill { position:absolute; z-index:500; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; height:48px; padding:0 18px; border:0; border-radius:999px; background:var(--surface); color:var(--ink); font:700 14px var(--font); box-shadow:var(--sh); cursor:pointer; white-space:nowrap; }
  .hotpill svg { width:18px; height:18px; stroke:var(--orange); fill:var(--orange); fill-opacity:.15; }
  .hotpill .go { stroke:var(--mut); fill:none; width:16px; height:16px; }
  .fab:active, .btn:active, .chip:active, .iconbtn:active, .hotpill:active { transform:translateY(1px) scale(.98); }
  .hotpill:active { transform:translateX(-50%) scale(.98); }
  .maplibregl-canvas { outline:none; }

  /* pins */
  .pin { position:relative; width:16px; height:16px; cursor:pointer; }
  .pin .dot { width:16px; height:16px; border-radius:50%; background:#fff; border:5px solid #1a73e8; box-sizing:border-box; box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .pin.quiet .dot { border-color:#1a73e8; }
  .pin.deal .dot { border-color:#ff6b00; }
  .pin.top1 .dot { width:22px; height:22px; margin:-3px; border-color:#ff6b00; background:#fff; }
  .pin .lbl { position:absolute; left:100%; top:50%; transform:translateY(-50%); margin-left:6px; white-space:nowrap; font:600 13px var(--font); color:#1b1b2f; text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 0 3px #fff; pointer-events:none; }
  .pin .lbl small { display:block; color:#e85a00; font:700 12px var(--font); }
  .pin .lbl.hide { display:none; }
  .me { width:20px; height:20px; border-radius:50%; background:#3b82f6; border:3px solid #fff; box-shadow:0 0 0 8px rgba(59,130,246,.2), 0 3px 8px rgba(0,0,0,.15); }

  /* ---------- карточки (сверху обложка) ---------- */
  .stack { display:grid; gap:16px; padding-top:6px; }
  .card { position:relative; background:var(--card); border-radius:22px; box-shadow:var(--sh); cursor:pointer; border:1px solid var(--line); overflow:hidden; }
  .cover { position:relative; height:112px; background:linear-gradient(135deg,var(--c,#eee),#fff 140%); display:grid; place-items:center; overflow:hidden; }
  .cover img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cover .cem { font-size:62px; }
  .cover.big { height:210px; }
  .cover.big .cem { font-size:104px; }
  .card .off { position:absolute; left:10px; top:10px; color:#fff; font:800 12px var(--font); border-radius:9px; padding:4px 9px; background:var(--red); box-shadow:0 3px 8px rgba(255,51,51,.35); }
  .card .heart { position:absolute; right:10px; top:10px; width:38px; height:38px; border-radius:50%; border:0; background:rgba(255,255,255,.92); box-shadow:var(--sh2); font-size:18px; cursor:pointer; display:grid; place-items:center; padding:0; color:var(--mut); }
  .card .heart.saved { color:var(--red); }
  .card .body { padding:12px 14px 14px; }
  .card .pr { font:800 22px/1 var(--font); letter-spacing:-.5px; }
  .card .pr small { font:600 13px var(--font); color:#a2a4bb; text-decoration:line-through; margin-left:6px; letter-spacing:0; }
  .card h4 { margin:8px 0 2px; font:700 15px/1.25 var(--font); }
  .card .mt { font-size:12px; font-weight:500; color:var(--mut); }
  .card .acts { display:flex; gap:8px; margin-top:12px; align-items:center; }
  .crown { position:absolute; left:10px; bottom:8px; background:var(--surface); color:var(--orange); font:800 11px var(--font); padding:4px 10px; border-radius:999px; box-shadow:var(--sh2); }
  .card.ended .cover { filter:grayscale(1); opacity:.7; }
  .card.ended .pr, .card.ended h4 { opacity:.55; }
  .ribbon { position:absolute; left:0; right:0; top:44px; text-align:center; font:800 13px var(--font); color:#fff; background:rgba(27,27,58,.78); padding:7px 0; z-index:2; }
  .endnote { margin-top:8px; font:600 12px/1.35 var(--font); color:var(--mut); background:var(--soft); border-radius:12px; padding:8px 10px; }
  .btn { font:700 13px var(--font); padding:10px 14px; border-radius:13px; border:0; background:var(--soft); color:var(--ink); cursor:pointer; min-height:40px; }
  .btn.pri { color:#fff; background:var(--violet); box-shadow:0 4px 0 #4320b8; }
  .btn.pri:active { box-shadow:0 1px 0 #4320b8; transform:translateY(3px); }
  .btn.ghost { background:var(--soft); }
  .btn:disabled { opacity:.55; cursor:default; }
  .btn.on { background:var(--lav); color:var(--violet); }

  /* совет ИИ */
  .advice { margin:0 0 14px; background:linear-gradient(135deg,#f0ebff,#fff); border:1px solid #e0d9ff; border-radius:20px; padding:12px; font-size:13px; display:flex; gap:12px; align-items:flex-start; cursor:pointer; }
  .advice .bot { flex:none; width:36px; height:36px; border-radius:12px; display:grid; place-items:center; color:#fff; background:linear-gradient(135deg,var(--violet2),var(--violet)); box-shadow:0 4px 10px rgba(106,61,255,.3); }
  .advice .bot svg { width:20px; height:20px; fill:currentColor; stroke:none; }
  .advice b { color:var(--violet); font-weight:800; }
  .advice > div { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .advice.open > div { -webkit-line-clamp:unset; }

  /* pages */
  .page { flex:1; min-height:0; overflow-y:auto; padding:calc(18px + env(safe-area-inset-top)) 16px 20px; -webkit-overflow-scrolling:touch; }
  .page h2 { margin:0 0 4px; font:800 26px/1.05 var(--font); letter-spacing:-.5px; }
  .sub { margin:0 0 16px; color:var(--mut); font-weight:500; }
  .empty { text-align:center; padding:44px 20px; font-weight:600; color:var(--mut); }
  .empty big { display:block; font-size:44px; margin-bottom:8px; }
  .note { margin:14px 4px 0; font-size:12px; color:var(--mut); font-weight:500; }
  .sec { margin:22px 2px 10px; font:800 16px var(--font); }

  /* карточка заведения */
  #place { position:absolute; inset:0; z-index:1500; background:var(--bg); transform:translateY(102%); transition:transform .28s ease; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #place.on { transform:none; }
  #place .back { position:absolute; left:12px; top:calc(12px + env(safe-area-inset-top)); z-index:3; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.95); box-shadow:var(--sh); cursor:pointer; display:grid; place-items:center; padding:0; color:var(--ink); }
  #place .pbody { background:var(--bg); margin-top:-24px; position:relative; border-radius:26px 26px 0 0; padding:20px 16px 30px; }
  #place h2 { margin:0; font:800 24px/1.1 var(--font); letter-spacing:-.4px; }
  .rate { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 14px; }
  .emj { font-size:1.2em; line-height:1; vertical-align:-.08em; }
  .rhint { display:block; margin-top:2px; font:500 12px var(--font); color:var(--mut); }
  .ic { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .tag { display:inline-flex; align-items:center; gap:6px; }
  .tag.open { color:#0b7a4f; background:#e4f8ee; border-color:#bfeed7; }
  .tag.shut { color:#b3261e; background:#fdeceb; border-color:#f6cbc8; }
  html.dark .tag.open { color:#6fe3b2; background:#10372b; border-color:#1d5c46; }
  html.dark .tag.shut { color:#ff9b94; background:#3b1a19; border-color:#5c2a28; }
  .addr { display:flex; align-items:center; gap:6px; color:var(--mut); font-weight:500; margin:6px 0 0; }
  .tag { font:700 13px var(--font); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 11px; border:1px solid var(--line); }
  .tag.star { color:#b86e00; background:#fff6e0; border-color:#ffe6ae; }
  .prow { display:flex; gap:8px; margin-bottom:6px; }
  .prow .btn, .prow a.btn { flex:1; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:8px; white-space:nowrap; font-size:14px; min-height:46px; background:var(--surface); border:1px solid var(--line); color:var(--ink); border-radius:14px; }
  .prow .btn.pri { background:var(--violet); border:0; color:#fff; }
  .plist { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:4px 14px; }
  .plist .r { display:flex; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); font-weight:600; }
  .plist .r:last-child { border:0; }
  .plist .r span:last-child { white-space:nowrap; font-weight:800; }
  .plist .r s { color:#a2a4bb; font-weight:600; margin-right:6px; }
  .plist .gh { font:800 11px var(--font); letter-spacing:.6px; text-transform:uppercase; color:var(--mut); padding:12px 0 2px; border:0; }

  /* профиль */
  .hero { background:var(--surface); border-radius:26px; padding:24px 18px 20px; text-align:center; box-shadow:var(--sh); border:1px solid var(--line); }
  .ava { position:relative; width:88px; height:88px; margin:0 auto; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--violet2)); color:#fff; display:grid; place-items:center; font:800 36px var(--font); cursor:pointer; box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--lav); }
  .ava img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .ava .edit { position:absolute; right:-2px; bottom:-2px; width:28px; height:28px; border-radius:50%; background:var(--orange); border:3px solid #fff; display:grid; place-items:center; }
  .ava .edit svg { width:13px; height:13px; stroke:#fff; stroke-width:2.4; }
  .hero h3 { margin:14px 0 0; font:800 20px var(--font); display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .status { margin:6px 0 0; color:var(--mut); font-weight:500; }
  .badge { display:inline-flex; align-items:center; gap:4px; font:800 11px var(--font); letter-spacing:.5px; text-transform:uppercase; padding:4px 9px; border-radius:8px; color:#fff; background:var(--mut); }
  .badge svg { width:11px; height:11px; fill:currentColor; stroke:none; }
  .badge.admin { background:var(--orange); } .badge.mod { background:var(--violet); } .badge.business { background:var(--mint); }
  .badge.legend { background:linear-gradient(135deg,#ffb800,#ff7a00); } .badge.user { background:var(--soft2); color:var(--mut); }
  .level { margin:14px 4px 0; text-align:left; }
  .level .lt { display:flex; justify-content:space-between; font:700 12px var(--font); color:var(--mut); margin-bottom:6px; }
  .level .bar2 { height:8px; border-radius:99px; background:var(--soft2); overflow:hidden; }
  .level .bar2 i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--violet),var(--orange)); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 0; }
  .stat { background:var(--soft); border-radius:16px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font:800 22px var(--font); }
  .stat span { font-size:11px; font-weight:600; color:var(--mut); text-transform:uppercase; }
  .ach { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .ach div { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:12px 6px; text-align:center; font:700 11px/1.25 var(--font); color:var(--ink); }
  .ach div em { display:block; font-style:normal; font-size:28px; margin-bottom:4px; }
  .ach div.lock { opacity:.45; filter:grayscale(1); }
  .menu-list { margin-top:14px; display:grid; gap:10px; }
  .menu-item { background:var(--surface); padding:16px; border-radius:18px; font-weight:700; display:flex; align-items:center; justify-content:space-between; cursor:pointer; box-shadow:var(--sh2); border:1px solid var(--line); color:var(--ink); text-decoration:none; }
  .menu-item svg { width:20px; height:20px; fill:none; stroke:var(--mut); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .menu-item .soon { font:700 11px var(--font); color:var(--mut); background:var(--soft); border-radius:99px; padding:4px 10px; }
  .credit { margin:18px 4px 0; font:500 11px/1.4 var(--font); color:#a9abc2; text-align:center; }
  .sys { background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:6px 16px; box-shadow:var(--sh2); }
  .sys .r { display:flex; justify-content:space-between; gap:10px; padding:11px 0; font-weight:600; border-bottom:1px solid var(--line); }
  .sys .r:last-child { border:0; }
  .sys .r span:first-child { color:var(--mut); }
  .sys .ok::before, .sys .bad::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; background:var(--mint); }
  .sys .bad::before { background:var(--red); }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; }
  .tile b { display:block; font:800 24px var(--font); } .tile span { font-size:12px; color:var(--mut); font-weight:600; }

  /* настройки */
  .set { background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:6px 14px; }
  .set .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); font-weight:700; }
  .set .row:last-child { border:0; }
  .seg { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .seg .btn { padding:8px 12px; min-height:36px; }
  .sw { width:52px; height:30px; border-radius:99px; border:0; background:var(--swoff); position:relative; cursor:pointer; flex:none; padding:0; }
  .sw::after { content:""; position:absolute; left:3px; top:3px; width:24px; height:24px; border-radius:50%; background:var(--surface); box-shadow:0 2px 4px rgba(0,0,0,.2); transition:left .15s; }
  .sw[aria-checked="true"] { background:var(--violet); }
  .sw[aria-checked="true"]::after { left:25px; }
  .topback { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .topback button { width:42px; height:42px; border-radius:50%; border:0; background:var(--surface); box-shadow:var(--sh2); cursor:pointer; display:grid; place-items:center; padding:0; color:var(--ink); }
  .topback h2 { margin:0; }

  /* окна */
  .mrow { display:grid; grid-template-columns:1fr 84px 38px; gap:6px; }
  .mrow .btn { padding:0; }
  .err { font-weight:600; color:#d12f6b; min-height:1em; }
  .btns { display:flex; gap:10px; margin-top:4px; }

  /* nav */
  nav { flex:none; display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background:var(--surface); padding:6px 6px calc(8px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.04); position:relative; z-index:700; border-top:1px solid var(--line); }
  nav button { border:0; background:transparent; padding:6px 0; min-height:54px; font:700 12px var(--font); color:var(--mut); cursor:pointer; display:grid; gap:3px; justify-items:center; border-radius:14px; }
  nav button svg { width:26px; height:26px; stroke-width:2; }
  nav button[hidden] { display:none; }
  nav button.on { color:var(--orange); }
  nav button.on svg { fill:var(--orange); fill-opacity:.16; stroke:var(--orange); }

  dialog { zoom:var(--zoom); border:0; border-radius:28px; padding:22px; width:min(400px,92vw); box-shadow:0 30px 70px rgba(0,0,0,.2); background:var(--surface); color:var(--ink); }
  dialog::backdrop { background:rgba(27,27,58,.45); backdrop-filter:blur(3px); }
  dialog form { display:grid; gap:12px; }
  dialog h3 { margin:0 0 2px; font:800 21px var(--font); }
  .toast { position:absolute; z-index:2500; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translate(-50%,20px); opacity:0; pointer-events:none; background:#25264a; color:#fff; border:1px solid rgba(255,255,255,.14); font:600 14px/1.35 var(--font); padding:12px 18px; border-radius:16px; box-shadow:0 10px 28px rgba(0,0,0,.35); transition:transform .22s, opacity .22s; width:max-content; max-width:min(88%,360px); text-align:center; }
  .toast.on { transform:translate(-50%,0); opacity:1; }

  /* эффекты логотипа */
  .fly { position:absolute; z-index:3000; font-size:26px; pointer-events:none; animation:fly .9s ease-out forwards; }
  @keyframes fly { from { transform:translate(0,0) scale(.6); opacity:1; } to { transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(var(--rot)); opacity:0; } }
  .rain { position:absolute; top:-40px; z-index:3000; font-size:28px; pointer-events:none; animation:rain 2.4s linear forwards; }
  @keyframes rain { to { transform:translateY(110vh) rotate(360deg); } }
  html.still *, html.still *::before, html.still *::after { animation:none !important; transition:none !important; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }

  .ptabs { display:flex; gap:6px; overflow-x:auto; background:var(--soft2); border-radius:16px; padding:5px; margin:6px 0 14px; scrollbar-width:none; }
  .ptabs::-webkit-scrollbar { display:none; }
  .ptab { flex:none; white-space:nowrap; border:0; background:transparent; font:700 13px var(--font); color:var(--mut); padding:10px 13px; border-radius:12px; cursor:pointer; display:flex; gap:6px; align-items:center; white-space:nowrap; }
  .ptab.on { background:var(--surface); color:var(--ink); box-shadow:var(--sh2); }
  .mphoto { margin-top:12px; }

  .mphoto img { width:100%; display:block; border-radius:18px; border:1px solid var(--line); }
  .ptab i { font-style:normal; background:#c9cce0; color:#fff; border-radius:99px; font-size:11px; padding:2px 7px; }
  .ptab.on i { background:var(--violet); }
  .stars { color:#f5a300; letter-spacing:1px; }
  .okb { color:#14a85f; font-weight:700; font-size:13px; }
  .rev { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; }
  .rev .rh { display:flex; gap:10px; align-items:center; margin-bottom:6px; }
  .rev .rav { flex:none; width:36px; height:36px; border-radius:50%; background:var(--lav); color:var(--violet); display:grid; place-items:center; font-weight:800; }
  .rev .rh small { display:block; color:var(--mut); font-weight:500; }
  .rev p { margin:0; line-height:1.4; }
  .revform { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:14px; display:grid; gap:10px; }
  .revform textarea { width:100%; min-height:80px; border:0; border-radius:12px; background:var(--soft); padding:10px 12px; font:500 14px var(--font); color:var(--ink); resize:vertical; outline:2px solid transparent; }
  .revform textarea:focus { outline-color:var(--violet2); }
  .starpick { display:flex; gap:4px; }
  .starpick button { border:0; background:none; font-size:30px; line-height:1; color:#d5d7e6; cursor:pointer; padding:2px; }
  .starpick button.on { color:#f5a300; }
  .dotg, .dotr { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:#14a85f; }
  .dotr { background:var(--red); }
  .prow2 { width:100%; display:flex; align-items:center; gap:14px; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:14px; box-shadow:var(--sh2); cursor:pointer; margin-bottom:6px; color:var(--ink); }
  .prow2 .pr-t { flex:1; min-width:0; display:grid; gap:2px; } .prow2 b { font:800 17px var(--font); } .prow2 em { font-style:normal; color:var(--mut); font-weight:600; font-size:12px; }
  .prow2 svg { width:20px; height:20px; fill:none; stroke:var(--mut); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .ava.sm { width:54px; height:54px; margin:0; font-size:22px; box-shadow:0 0 0 2px #fff, 0 0 0 4px var(--lav); }
  button.level { display:block; width:calc(100% - 8px); background:none; border:0; padding:0; font:inherit; color:inherit; cursor:pointer; }
  .lvhint { text-align:center; font:600 11px var(--font); color:var(--violet); margin-top:6px; }
  .seg2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg2 .btn { padding:12px 8px; }
  .bizn { background:#e9fbf3; color:#0b7a4b; border-radius:12px; padding:8px 10px; font:600 12px/1.35 var(--font); margin-top:10px; }
  @media (max-width:519px) { input, select, textarea { font-size:16px !important; } }
  @media (max-height:640px) { .cover { height:90px; } }

  /* тёмная тема: включается вручную или автоматически по времени суток (см. applyTheme) */
  html.dark { color-scheme:dark; --ink:#eceefb; --mut:#a4a7c6; --line:#2d2f4d; --bg:#14152a; --card:#1e2038; --surface:#1e2038; --soft:#2a2c49; --soft2:#34375c; --lav:#2f2b57; --swoff:#41445f;
    --sh:0 4px 14px rgba(0,0,0,.45); --sh2:0 2px 8px rgba(0,0,0,.4); }

</style>

let mapReady = false, mapErrShown = false, ringData = null, want3d = false;
function circleGeo(lat, lon, r, n = 64) {
  const pts = [], dLat = r / 111320, dLon = r / (111320 * Math.cos(lat * Math.PI / 180));
  for (let i = 0; i <= n; i++) { const a = i / n * 2 * Math.PI; pts.push([lon + dLon * Math.cos(a), lat + dLat * Math.sin(a)]); }
  return { type:'Feature', geometry:{ type:'Polygon', coordinates:[pts] } };
}
function setRing(lat, lon, r) { ringData = circleGeo(lat, lon, r); if (mapReady && map.getSource('ring')) map.getSource('ring').setData(ringData); }
function addRing() {
  if (map.getSource('ring')) return;
  map.addSource('ring', { type:'geojson', data:ringData || circleGeo(state.me[0], state.me[1], 800) });
  map.addLayer({ id:'ring-line', type:'line', source:'ring', paint:{ 'line-color':'#6a3dff', 'line-width':1.6, 'line-opacity':.55, 'line-dasharray':[2, 2] } });
}
map.on('load', () => { mapReady = true; addRing(); });

  map.setStyle(dark ? STYLE_DARK : STYLE_LIGHT); map.once('style.load', addRing);
}

/* ================= умный поиск: опечатки, синонимы, раскладка ================= */
const FOLD = { 'ё':'е','ә':'а','ө':'о','ү':'у','ұ':'у','қ':'к','ғ':'г','ң':'н','һ':'х','і':'и','ӊ':'н' };
const fold = s => String(s).toLowerCase().replace(/[ёәөүұқғңһіӊ]/g, c => FOLD[c]).replace(/[^a-zа-я0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const GROUPS = [
  ['донер','донэр','дунер','донар','doner','kebab','кебаб'], ['шаурма','шаверма','шаварма','shawarma'],
  ['чай','чаи','chai','tea','шай'], ['кофе','кофэ','coffee','капучино','каппучино','латте','американо','эспрессо','кофейня'],
  ['плов','палов','plov','palov'], ['пицца','пица','pizza','пиццa'], ['бургер','бюргер','гамбургер','burger'],
  ['борщ','борш'], ['самса','самсы','samsa'], ['манты','манти','manty','мантый'], ['лагман','lagman'],
  ['выпечка','булочка','булка','круассан','хлеб','пекарня','bakery'], ['обед','ланч','lunch'], ['суп','сорпа','soup'],
  ['йогурт','кефир','айран','ayran'], ['сэндвич','сендвич','sandwich'], ['картошка','фри','картофель'],
].map(g => g.map(fold));
const ALIAS = []; GROUPS.forEach((g, gi) => g.forEach(w => ALIAS.push([w, gi])));
const EN2RU = { q:'й',w:'ц',e:'у',r:'к',t:'е',y:'н',u:'г',i:'ш',o:'щ',p:'з','[':'х',']':'ъ',a:'ф',s:'ы',d:'в',f:'а',g:'п',h:'р',j:'о',k:'л',l:'д',';':'ж',"'":'э',z:'я',x:'ч',c:'с',v:'м',b:'и',n:'т',m:'ь',',':'б','.':'ю' };
const fixLayout = s => s.toLowerCase().split('').map(c => EN2RU[c] || c).join('');
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length:n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
const maxDist = len => len <= 2 ? 0 : len <= 5 ? 1 : 2;
function nearest(tok, words) {                              // ближайшее слово из списка с учётом опечаток
  let best = null, bd = 99; const lim = maxDist(tok.length);
  for (const w of words) {
    if (Math.abs(w.length - tok.length) > lim) continue;
    if (tok.length <= 3 && w[0] !== tok[0]) continue;
    const d = lev(tok, w); if (d <= lim && d < bd) { best = w; bd = d; }
  }
  return best;
}
function resolveToken(raw) {
  const cands = [fold(raw)]; if (/^[a-z\[\];',.]+$/i.test(raw)) cands.push(fold(fixLayout(raw)));
  const words = ALIAS.map(a => a[0]);
  for (const c of cands) {
    if (!c) continue;
    const ex = ALIAS.find(a => a[0] === c); if (ex) return { alts:GROUPS[ex[1]], canon:GROUPS[ex[1]][0], word:c };
    if (c.length >= 3) { const pf = ALIAS.find(a => a[0].startsWith(c)); if (pf) return { alts:GROUPS[pf[1]], canon:GROUPS[pf[1]][0], word:c, prefix:true }; }
    const nn = nearest(c, words); if (nn) { const g = ALIAS.find(a => a[0] === nn)[1]; return { alts:GROUPS[g], canon:GROUPS[g][0], word:c }; }
  }
  return { alts:[cands[cands.length - 1] || ''], canon:null, word:cands[0] };
}
let searchHint = [];
function buildFilter(q) {
  const raws = q.trim().split(/\s+/).filter(x => fold(x).length > 0);
  if (!raws.length) { searchHint = []; return null; }
  const vocab = [...new Set(items.flatMap(d => fold(d.title + ' ' + d.venue_name).split(' ')).filter(w => w.length > 2))];
  const toks = raws.map(r => {
    const tk = resolveToken(r);
    if (!tk.canon && tk.word.length > 2) { const nn = nearest(tk.word, vocab); if (nn && nn !== tk.word) { tk.alts = [nn]; tk.canon = nn; } }
    return tk;
  });
  searchHint = toks.filter(x => x.canon && !x.prefix && x.canon !== x.word).map(x => x.canon);
  return d => { const hay = fold(d.title + ' ' + d.venue_name + ' ' + (CAT[d.category] ? t(d.category) : '')); return toks.every(tk => tk.alts.some(a => a && hay.includes(a))); };
}
const visible = () => { const f = buildFilter(state.q); return f ? items.filter(f) : items; };

/* завершённые акции в избранном: серые, с плашкой, через 3 дня исчезают сами */
async function checkSaved() {
  const ids = Object.keys(saved).slice(0, 40);
  await Promise.all(ids.map(async id => {
    try {
      const r = await fetch('/deals/' + id); let ended;
      if (r.status === 404) ended = true; else if (r.ok) { const d = await r.json(); ended = d.status !== 'active' || (d.ends_at && new Date(d.ends_at) < new Date()); } else return;
      const s = saved[id]; if (!s) return;
      if (ended && !s.endedAt) s.endedAt = Date.now(); if (!ended) delete s.endedAt; s.ended = !!ended;
    } catch (e) {}
  }));
  Object.keys(saved).forEach(id => { if (saved[id].endedAt && Date.now() - saved[id].endedAt > 3 * 86400000) delete saved[id]; });
  persist(); renderSaved();
}
$('clearEnded').onclick = () => { Object.keys(saved).forEach(id => { if (saved[id].ended) delete saved[id]; }); persist(); renderSaved(); render(); };

/* ================= нижняя панель: тянется вверх, как в картографических приложениях ================= */
let sheetState = 'peek';
const sheetEl = $('sheet'), PEEK_H = 176;
const tyFor = st => st === 'peek' ? sheetEl.offsetHeight - PEEK_H : st === 'half' ? sheetEl.offsetHeight * 0.46 : 0;
function setSheet(st) {
  sheetState = st; sheetEl.dataset.s = st; sheetEl.style.transform = ''; sheetEl.classList.remove('drag');
  document.querySelector('.fabs').classList.toggle('hide', st !== 'peek');
  if (st === 'peek') $('sbody').scrollTop = 0;
}
(function () {
  const h = $('shandle'); let d = null;
  h.addEventListener('pointerdown', e => { d = { y0:e.clientY, base:tyFor(sheetState), t0:Date.now(), moved:false }; sheetEl.classList.add('drag'); try { h.setPointerCapture(e.pointerId); } catch (x) {} });
  h.addEventListener('pointermove', e => {
    if (!d) return; const dy = e.clientY - d.y0; if (Math.abs(dy) > 5) d.moved = true;
    const z = +S.size || 1, ty = Math.min(Math.max(d.base + dy / z, 0), tyFor('peek')); sheetEl.style.transform = `translateY(${ty}px)`;
  });
  const end = e => {
    if (!d) return; const dy = e.clientY - d.y0, v = dy / Math.max(Date.now() - d.t0, 1), z = +S.size || 1; sheetEl.classList.remove('drag');
    if (!d.moved) { setSheet(sheetState === 'peek' ? 'half' : 'peek'); d = null; return; }
    const order = ['peek', 'half', 'full'], cur = order.indexOf(sheetState); let next;
    if (v > 0.5) next = Math.max(cur - 1, 0); else if (v < -0.5) next = Math.min(cur + 1, 2);
    else { const ty = d.base + dy / z; next = order.map(st => [st, Math.abs(tyFor(st) - ty)]).sort((a, b) => a[1] - b[1])[0][0]; setSheet(next); d = null; return; }
    setSheet(order[next]); d = null;
  };
  h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end);
  h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSheet(sheetState === 'peek' ? 'half' : 'peek'); } });
})();

let logoClicks = 0;
function burst() {

function photoToData(file) {
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const S2 = 256, c = document.createElement('canvas'); c.width = c.height = S2; const m = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S2, S2); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', .85)); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('bad image')); }; img.src = url;
  });
}

};
$('m_save').onclick = async () => {
  const its = menuDraft.filter(x => x.name && x.price >= 0); if (!its.length) { $('m_err').textContent = 'Нечего сохранять'; return; }
  const r = await fetch(`/venues/${$('m_venue').value}/menu`, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ items:its }) }).catch(() => null);
  if (!r) { $('m_err').textContent = 'Нет связи с сервером'; return; }
  if (!r.ok) { $('m_err').textContent = 'Ошибка: ' + JSON.stringify((await r.json().catch(() => ({}))).detail || r.status); return; }
  prof.menus++; saveProf(); renderProfile(); $('mdlg').close(); toast('Меню добавлено');
};

/* ================= первый запуск: кто ты ================= */
/* Роли «модератор» и «админ» здесь выбрать нельзя. Заявка бизнеса уходит на проверку модератору. */
let oKind = 'adult';
$('oKind').addEventListener('click', e => {
  const b = e.target.closest('[data-kind]'); if (!b) return; oKind = b.dataset.kind;
  document.querySelectorAll('#oKind .btn').forEach(x => x.classList.toggle('on', x === b)); $('oBiz').hidden = oKind !== 'biz'; $('o_err').textContent = '';
});
$('odlg').addEventListener('cancel', () => { prof.onboarded = true; saveProf(); renderProfile(); });
$('oform').addEventListener('submit', async e => {
  e.preventDefault();
    if (oKind === 'biz') {
    const vname = $('o_vname').value.trim(); if (vname.length < 2) { $('o_err').textContent = 'Напишите название заведения'; return; }
    const r = await fetch('/business-requests', { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify({ venue_name:vname, address:$('o_addr').value.trim() || null, phone:$('o_phone').value.trim() || null, contact_name:$('o_name').value.trim() || null }) }).catch(() => null);
    if (!r) { $('o_err').textContent = t('net_err'); return; }
    if (!r.ok) { $('o_err').textContent = r.status === 429 ? 'Слишком много заявок, попробуйте позже' : 'Не получилось отправить заявку'; return; }
    prof.bizRequest = { name:vname, at:Date.now() }; toast('Заявка отправлена. Модератор проверит заведение');
  }
  if ($('o_name').value.trim()) prof.name = $('o_name').value.trim();
  prof.onboarded = true; saveProf(); $('odlg').close(); renderProfile();
});

/* ================= старт ================= */
setSheet('peek');
applySettings();
if (!prof.onboarded) setTimeout(() => { try { $('odlg').showModal(); } catch (e) {} }, 400);
fetch('/health').then(r => r.json()).then(h => { state.ai = !!(h.ai && h.ai.provider !== 'mock' && h.ai.configured); }).catch(() => {}).finally(() => { load(); checkSaved(); });
</script>
</body>
